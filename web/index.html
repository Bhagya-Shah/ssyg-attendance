<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a66" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SSYG">
<meta name="description" content="SSYG attendance: events, members and reports">
<title>SSYG Attendance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loading" class="loading hidden"></div>

<header class="appbar">
  <button class="icon-btn hidden" id="backBtn" aria-label="Back"></button>
  <img class="logo" id="logo" src="logo.png" alt="SSYG logo" width="40" height="40">
  <div class="appbar-title">
    <div class="brand" id="appTitle">SSYG Attendance</div>
    <div class="appbar-sub" id="appSub">Viewing</div>
  </div>
  <button class="role-btn" id="authBtn"></button>
</header>

<main id="main">
  <!-- EVENTS -->
  <section class="view" id="view-events">
    <div class="stats" id="stats"></div>
    <div class="search"><span class="search-ico"></span><input id="eventSearch" type="search" placeholder="Search events" autocomplete="off"></div>
    <div id="eventList"></div>
  </section>

  <!-- EVENT DETAIL -->
  <section class="view hidden" id="view-event">
    <div class="hero">
      <div class="hero-top">
        <div class="hero-date" id="evDate"></div>
        <button class="chip-btn admin-only" id="editEventBtn">Edit</button>
      </div>
      <h1 class="hero-name" id="evName"></h1>
      <p class="hero-desc" id="evDesc"></p>
      <div class="hero-count">
        <div><span class="big" id="evPresent">0</span><span class="of" id="evOf"></span></div>
        <div class="bar"><span id="evBar"></span></div>
      </div>
    </div>
    <div class="search"><span class="search-ico"></span><input id="attSearch" type="search" placeholder="Search members" autocomplete="off"></div>
    <div class="seg admin-only" id="attFilter">
      <button data-f="all" class="on">All</button>
      <button data-f="present">Present</button>
      <button data-f="absent">Absent</button>
    </div>
    <div class="list" id="attList"></div>
    <div class="spacer-actions admin-only"></div>
  </section>

  <!-- MEMBERS -->
  <section class="view hidden" id="view-members">
    <div class="row-between">
      <div class="section-title" id="memberCount">Members</div>
      <button class="chip-btn admin-only" id="bulkBtn">Paste list</button>
    </div>
    <div class="search"><span class="search-ico"></span><input id="memberSearch" type="search" placeholder="Search members" autocomplete="off"></div>
    <div class="list" id="memberList"></div>
    <div class="admin-only removed-toggle">
      <button class="link-btn" id="showRemovedBtn"></button>
    </div>
    <div class="list hidden" id="removedList"></div>
  </section>

  <!-- REPORTS -->
  <section class="view hidden" id="view-reports">
    <div class="card">
      <div class="card-title">Attendance report</div>
      <div class="chips" id="rangeChips">
        <button data-range="month">This month</button>
        <button data-range="last">Last month</button>
        <button data-range="3m">3 months</button>
        <button data-range="year">This year</button>
        <button data-range="all" class="on">All time</button>
      </div>
      <div class="two">
        <label class="field"><span>From</span><input type="date" id="fromDate"></label>
        <label class="field"><span>To</span><input type="date" id="toDate"></label>
      </div>
      <label class="switch-row"><span>Include removed members</span><input type="checkbox" id="incRemoved" class="switch"></label>
      <button class="btn primary block" id="previewBtn">Show report</button>
    </div>
    <div id="reportOut" class="hidden">
      <div class="stats" id="reportStats"></div>
      <div class="row-between">
        <div class="section-title">By member</div>
        <button class="chip-btn" id="tableBtn">Full table</button>
      </div>
      <div class="list" id="reportList"></div>
      <div class="table-wrap hidden" id="reportTableWrap"><table id="reportTable"></table></div>
      <div class="spacer-actions"></div>
    </div>
  </section>
</main>

<!-- Bottom action bar (marking attendance / downloading) -->
<div class="actionbar hidden" id="actionbar"></div>

<button class="fab hidden" id="fab" aria-label="Add"></button>

<nav class="tabbar" id="tabbar">
  <button data-tab="events" class="on"><span class="ti" data-icon="calendar"></span><span>Events</span></button>
  <button data-tab="members"><span class="ti" data-icon="users"></span><span>Members</span></button>
  <button data-tab="reports"><span class="ti" data-icon="chart"></span><span>Reports</span></button>
</nav>

<div id="sheetRoot"></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
